name: Portfolio Optimization QA Notebook Runner

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: "blueprint-github-test image the QA cases run in"
        required: false
        type: string
        default: "nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-notebooks:
    runs-on: arc-runners-org-nvidia-ai-bp-1-gpu
    timeout-minutes: 120
    env:
      TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
      NOTEBOOK_IMAGE: nvcr.io/nvidia/pytorch:25.08-py3
      REPORT: quantitative_portfolio_optimization.html
    steps:
      # Credentials are deliberately persisted: `git lfs pull` below runs
      # outside the action and needs the checkout credential helper.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 # zizmor: ignore[artipacked]

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Execute notebooks
        run: |
          docker run --gpus all --rm \
            -v "$(pwd):/workspace" \
            -w /workspace \
            "$NOTEBOOK_IMAGE" \
            bash -lc 'ci/utils/run_notebooks.sh cuda13'

      - name: Run QA test cases
        if: always()
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          cd notebooks
          if [ -z "${TEST_DOCKER_PULL_KEY}" ]; then
            echo "TEST_DOCKER_PULL_KEY is not set"
            exit 1
          fi
          missing=0
          for f in cvar_basic_result.html efficient_frontier_result.html rebalancing_strategies_result.html; do
            if [ ! -s "$f" ]; then
              echo "Missing notebook result: notebooks/$f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          echo "Test image: ${TEST_IMAGE}"
          set +e
          docker run --rm \
            -v "$(pwd)/cvar_basic_result.html:/app/input/quantitative_portfolio_optimization/cvar_basic.html:ro" \
            -v "$(pwd)/efficient_frontier_result.html:/app/input/quantitative_portfolio_optimization/efficient_frontier.html:ro" \
            -v "$(pwd)/rebalancing_strategies_result.html:/app/input/quantitative_portfolio_optimization/rebalancing_strategies.html:ro" \
            -v "$(pwd):/workspace" \
            "$TEST_IMAGE" \
            pytest -m quantitative_portfolio_optimization \
              --timeout=900 \
              --disable-warnings \
              --html="/workspace/${REPORT}" \
              --self-contained-html
          status=$?
          set -e
          if [ ! -s "${REPORT}" ]; then
            echo "No pytest report written: notebooks/${REPORT}"
            exit 1
          fi
          exit "$status"

      - name: Upload notebook results and pytest report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: qa-notebook-results
          path: |
            notebooks/*_result.html
            notebooks/*.papermill.log
            notebooks/*.nbconvert.log
            notebooks/notebook_status.txt
            notebooks/quantitative_portfolio_optimization.html
          retention-days: 30

      - name: Set result output
        id: set_result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${JOB_STATUS}" = "success" ]; then
            echo "RESULT=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "RESULT=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Send mail
        if: always()
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>

            <p>The workflow for repository: <strong>${{ github.repository }}</strong> has completed.<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>

            <p>You can review the details on GitHub:<br>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>

            <p>Thanks!</p>
