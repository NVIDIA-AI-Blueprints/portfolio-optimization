# Shortcuts for the experiments under experiments/ (https://taskfile.dev).
# `task --list` shows every task. A YAML configuration file describes an
# experiment completely; CONFIG selects it, for example
# `task experiments:run CONFIG=experiments/simulator_comparison/configs/full.yaml`.
#
# The experiments read .env themselves, through the library's defaults, so this
# file loads none: services and GPUs are configured in .env alone. Only
# experiments:devices sets JOINTFM_LOCAL_BASE_URL per session, which overrides
# the same variable in .env, and hides every GPU from its CPU session.
#
# Every task ends with an echo "<task> succeeded ..." command, so a finished
# task says so explicitly; Task stops at the first failing command, so the
# message appears only when every command before it succeeded.

version: '3'

vars:
  CONFIG_DIR: experiments/simulator_comparison/configs
  # CUDA extra of pyproject.toml for the cuML arm: cuda12, cuda13, or cuda13-socp.
  CUDA_EXTRA: '{{.CUDA_EXTRA | default "cuda13"}}'
  # uv run installs what the experiment needs without removing anything else.
  UV_EXPERIMENTS: uv run --extra {{.CUDA_EXTRA}} --extra jointfm --extra experiments
  # Everything the tasks, the tests, and the notebooks use, in one environment.
  UV_SYNC_ALL: >-
    uv sync --locked --extra {{.CUDA_EXTRA}} --extra jointfm --extra experiments
    --group dev --group notebooks
  # Visibility for a lock the task rewrote; committing it stays a manual step.
  LOCK_STATUS: >-
    git diff --quiet -- uv.lock && echo "uv.lock has no uncommitted changes"
    || echo "uv.lock has uncommitted changes: review git diff uv.lock and commit it"
  # Scanner images: docker resolves the digest and ignores the tag, which is kept for readers.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
      - echo "default succeeded"
    silent: true

  stats:
    desc: >-
      Show lines added and removed by all authors' commits on the current
      branch today, over the last 7, 28, and 365 calendar days (each window
      includes today), and over the whole history, with the average per
      calendar day
    set: [errexit, nounset, pipefail]
    cmds:
      - |
        TODAY_START="$(git rev-parse --since='0 days ago 00:00' | sed 's/^--max-age=//')"
        FIRST_DAY="$(git log --format='%ct %cd' --date=format-local:%Y-%m-%d | sort -n | awk 'NR == 1 { print $2 }')"
        FIRST_DAY_START="$(git rev-parse --since="$FIRST_DAY 00:00" | sed 's/^--max-age=//')"
        # Rounding absorbs the hour a daylight-saving switch adds to or removes from a day.
        ALL_DAYS=$(( (TODAY_START - FIRST_DAY_START + 43200) / 86400 + 1 ))
        echo "Lines added and removed by the commits on $(git rev-parse --abbrev-ref HEAD) since $FIRST_DAY, all authors (merge commits and binary files not counted)"
        printf '%-7s %5s %9s %9s %9s %10s %12s\n' window days added removed net added/day removed/day
        for WINDOW in 1 7 28 365 all; do
          case "$WINDOW" in
            1) LABEL=today DAYS=1 ;;
            all) LABEL=all DAYS="$ALL_DAYS" ;;
            *) LABEL="${WINDOW}d" DAYS="$WINDOW" ;;
          esac
          git log --since="$((DAYS - 1)) days ago 00:00" --numstat --pretty=tformat: \
            | awk -v label="$LABEL" -v days="$DAYS" '$1 != "-" { added += $1; removed += $2 }
                END { printf "%-7s %5d %9d %9d %9d %10.1f %12.1f\n", label, days, added, removed, added - removed, added / days, removed / days }'
        done
      - echo "stats succeeded"
    silent: true

  setup:
    desc: >-
      Reconcile uv.lock with pyproject.toml without upgrading pinned versions,
      then install the locked environment with every extra and group the tasks,
      tests, and notebooks use (CUDA_EXTRA selects the CUDA extra), the git
      pre-commit hooks, and the Jupyter kernel
    cmds:
      - uv lock
      - '{{.UV_SYNC_ALL}}'
      - uv run pre-commit install --install-hooks
      - >-
        uv run python -m ipykernel install --user --name=portfolio-opt
        --display-name "Portfolio Optimization"
      - '{{.LOCK_STATUS}}'
      - echo "setup succeeded with --extra {{.CUDA_EXTRA}}"

  lock:upgrade:
    desc: >-
      Move every pin in uv.lock to the newest version pyproject.toml allows,
      install it, and run the CPU tests; review and commit uv.lock yourself
    cmds:
      - uv lock --upgrade
      - '{{.UV_SYNC_ALL}}'
      - task: experiments:test
      - '{{.LOCK_STATUS}}'
      - echo "lock:upgrade succeeded with --extra {{.CUDA_EXTRA}}"

  pre-commit:
    desc: >-
      Run every pre-commit hook, the pytest suite included, on all files; a git
      commit runs the same hooks on the files it stages once setup installed them
    cmds:
      - uv run --group dev pre-commit run --all-files
      - echo "pre-commit succeeded"

  secret-scan:
    desc: >-
      Fail when gitleaks finds a credential in any commit of the git history
      (needs docker)
    cmds:
      - docker run --rm -v "$PWD:/repo" {{.GITLEAKS_IMAGE}} git /repo --redact --no-banner
      - echo "secret-scan succeeded"

  vuln-scan:
    desc: >-
      Fail when a package pinned in uv.lock has a known vulnerability, scanned
      by osv-scanner with the waivers of osv-scanner.toml (needs docker)
    cmds:
      - >-
        docker run --rm -v "$PWD:/src" {{.OSV_SCANNER_IMAGE}} scan source
        --config /src/osv-scanner.toml --lockfile /src/uv.lock
      - echo "vuln-scan succeeded"

  experiments:run:
    desc: >-
      Run the simulator comparison of CONFIG (default: full.yaml), resuming its
      results file if it exists
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/full.yaml")}}'
    cmds:
      - '{{.UV_EXPERIMENTS}} python -m experiments.simulator_comparison --config {{.CONFIG}}'
      - echo "experiments:run succeeded for {{.CONFIG}}"

  experiments:report:
    desc: >-
      Tables and plots of the results of CONFIG (default full.yaml); EXCLUDE
      leaves out arms, e.g. EXCLUDE=jointfm-cpu while that session still runs
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/full.yaml")}}'
    cmds:
      - >-
        uv run --extra experiments python -m experiments.simulator_comparison.report
        --config {{.CONFIG}} {{if .EXCLUDE}}--exclude {{.EXCLUDE}}{{end}}
      - echo "experiments:report succeeded for {{.CONFIG}}"

  experiments:rebalance:
    desc: >-
      Rebalancing backtest of every trial's universe per simulator for CONFIG
      (default full.yaml), resuming its results file, then its report
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/full.yaml")}}'
    cmds:
      - '{{.UV_EXPERIMENTS}} python -m experiments.simulator_comparison.rebalancing --config {{.CONFIG}}'
      - echo "experiments:rebalance succeeded for {{.CONFIG}}"

  experiments:rebalance-report:
    desc: >-
      Tables and plots of the rebalancing results of CONFIG (default full.yaml),
      without running anything
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/full.yaml")}}'
    cmds:
      - >-
        uv run --extra experiments python -m
        experiments.simulator_comparison.rebalancing_report --config {{.CONFIG}}
      - echo "experiments:rebalance-report succeeded for {{.CONFIG}}"

  experiments:universe-sizes:
    desc: >-
      Rebalancing backtest of nested asset subsets of every trial's universe
      per simulator for CONFIG (default full.yaml), resuming its results file,
      then the blog figures
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/full.yaml")}}'
    cmds:
      - '{{.UV_EXPERIMENTS}} python -m experiments.simulator_comparison.universe_sizes --config {{.CONFIG}}'
      - task: experiments:blog
        vars: {CONFIG: '{{.CONFIG}}'}
      - echo "experiments:universe-sizes succeeded for {{.CONFIG}}"

  experiments:blog:
    desc: >-
      Blog figures of the scenario and rebalancing results of CONFIG (default
      full.yaml) and of the CPU-against-GPU results of DEVICES_CONFIG (default
      devices.yaml, filled by experiments:devices), written to <output
      stem>_blog beside them, without running anything
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/full.yaml")}}'
      DEVICES_CONFIG: '{{.DEVICES_CONFIG | default (print .CONFIG_DIR "/devices.yaml")}}'
    cmds:
      - >-
        uv run --extra experiments python -m experiments.simulator_comparison.blog
        --config {{.CONFIG}} --devices-config {{.DEVICES_CONFIG}}
      - echo "experiments:blog succeeded for {{.CONFIG}}"

  experiments:paired:
    desc: >-
      Paired change of every reading from the RESULTS (scenario or
      rebalancing) of BASELINE to those of CONFIG, two configs that differ
      only in SETTING (look_back, horizons, risk_aversion, or checkpoint) and
      their output files, written into CONFIG's report, without running anything
    requires:
      vars: [BASELINE, CONFIG, SETTING, RESULTS]
    cmds:
      - >-
        uv run --extra experiments python -m experiments.simulator_comparison.paired
        --baseline {{.BASELINE}} --config {{.CONFIG}} --setting {{.SETTING}}
        --results {{.RESULTS}}
      - echo "experiments:paired succeeded for {{.SETTING}} of {{.BASELINE}} against {{.CONFIG}}"

  experiments:all:
    desc: >-
      Run the scenario comparison of CONFIG (default full.yaml), its report,
      the rebalancing backtests with their report, the universe-size
      backtests, and the blog figures, resuming every results file
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/full.yaml")}}'
    cmds:
      - task: experiments:run
        vars: {CONFIG: '{{.CONFIG}}'}
      - task: experiments:report
        vars: {CONFIG: '{{.CONFIG}}'}
      - task: experiments:rebalance
        vars: {CONFIG: '{{.CONFIG}}'}
      - task: experiments:universe-sizes
        vars: {CONFIG: '{{.CONFIG}}'}
      - echo "experiments:all succeeded for {{.CONFIG}}"

  experiments:fresh:
    desc: >-
      Delete every output of CONFIG (default full.yaml), then run
      experiments:all from scratch
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/full.yaml")}}'
    cmds:
      - >-
        uv run --extra experiments python -m experiments.simulator_comparison.clean
        --config {{.CONFIG}}
      - task: experiments:all
        vars: {CONFIG: '{{.CONFIG}}'}
      - echo "experiments:fresh succeeded for {{.CONFIG}}"

  experiments:devices:
    desc: >-
      CPU-against-GPU experiment of CONFIG (default devices.yaml), resuming its
      results: the GPU session against the local JointFM service at GPU_URL,
      then the CPU session against the one at CPU_URL with every GPU hidden,
      each URL set as JOINTFM_LOCAL_BASE_URL over .env, then its report
    requires:
      vars: [GPU_URL, CPU_URL]
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/devices.yaml")}}'
    cmds:
      - >-
        JOINTFM_LOCAL_BASE_URL={{.GPU_URL}} {{.UV_EXPERIMENTS}} python -m
        experiments.simulator_comparison.devices --config {{.CONFIG}} --device GPU
      - >-
        CUDA_VISIBLE_DEVICES= JOINTFM_LOCAL_BASE_URL={{.CPU_URL}}
        {{.UV_EXPERIMENTS}} python -m experiments.simulator_comparison.devices
        --config {{.CONFIG}} --device CPU
      - task: experiments:devices-report
        vars: {CONFIG: '{{.CONFIG}}'}
      - echo "experiments:devices succeeded for {{.CONFIG}}"

  experiments:devices-fresh:
    desc: >-
      Delete every output of the CPU-against-GPU configuration CONFIG (default
      devices.yaml), then run experiments:devices from scratch
    requires:
      vars: [GPU_URL, CPU_URL]
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/devices.yaml")}}'
    cmds:
      - >-
        uv run --extra experiments python -m experiments.simulator_comparison.clean
        --devices-config {{.CONFIG}}
      - task: experiments:devices
        vars: {CONFIG: '{{.CONFIG}}', GPU_URL: '{{.GPU_URL}}', CPU_URL: '{{.CPU_URL}}'}
      - echo "experiments:devices-fresh succeeded for {{.CONFIG}}"

  experiments:devices-report:
    desc: >-
      Tables and figures of the CPU-against-GPU results of CONFIG (default
      devices.yaml), written to <output stem>_report beside them, without
      running anything
    vars:
      CONFIG: '{{.CONFIG | default (print .CONFIG_DIR "/devices.yaml")}}'
    cmds:
      - >-
        uv run --extra experiments python -m
        experiments.simulator_comparison.devices_report --config {{.CONFIG}}
      - echo "experiments:devices-report succeeded for {{.CONFIG}}"

  experiments:suite:
    internal: true
    desc: >-
      The experiments of SET (pilot or full): experiments:all of SET.yaml, the
      rebalancing backtest of its risk-averse twin, and the paired comparison
      of the two backtests, resuming every results file
    requires:
      vars: [SET]
    cmds:
      - task: experiments:all
        vars: {CONFIG: '{{.CONFIG_DIR}}/{{.SET}}.yaml'}
      - task: experiments:rebalance
        vars: {CONFIG: '{{.CONFIG_DIR}}/{{.SET}}_risk_averse.yaml'}
      - task: experiments:paired
        vars:
          BASELINE: '{{.CONFIG_DIR}}/{{.SET}}.yaml'
          CONFIG: '{{.CONFIG_DIR}}/{{.SET}}_risk_averse.yaml'
          SETTING: risk_aversion
          RESULTS: rebalancing
      - echo "experiments:suite succeeded for {{.SET}}"

  experiments:pilot-twins:
    internal: true
    desc: >-
      The scenario comparisons and reports of the pilot's next-day and
      long-history twins and the paired comparison of each against pilot.yaml,
      resuming every results file
    cmds:
      - task: experiments:run
        vars: {CONFIG: '{{.CONFIG_DIR}}/pilot_next_day.yaml'}
      - task: experiments:report
        vars: {CONFIG: '{{.CONFIG_DIR}}/pilot_next_day.yaml'}
      - task: experiments:paired
        vars:
          BASELINE: '{{.CONFIG_DIR}}/pilot.yaml'
          CONFIG: '{{.CONFIG_DIR}}/pilot_next_day.yaml'
          SETTING: horizons
          RESULTS: scenario
      - task: experiments:run
        vars: {CONFIG: '{{.CONFIG_DIR}}/pilot_long_history.yaml'}
      - task: experiments:report
        vars: {CONFIG: '{{.CONFIG_DIR}}/pilot_long_history.yaml'}
      - task: experiments:paired
        vars:
          BASELINE: '{{.CONFIG_DIR}}/pilot.yaml'
          CONFIG: '{{.CONFIG_DIR}}/pilot_long_history.yaml'
          SETTING: look_back
          RESULTS: scenario
      - echo "experiments:pilot-twins succeeded"

  experiments:clean-configs:
    internal: true
    desc: >-
      Delete every output of the configs NAMES, each a file name in
      CONFIG_DIR without .yaml
    requires:
      vars: [NAMES]
    cmds:
      - >-
        for name in {{.NAMES}}; do
        uv run --extra experiments python -m experiments.simulator_comparison.clean
        --config {{.CONFIG_DIR}}/$name.yaml || exit 1; done
      - echo "experiments:clean-configs succeeded for {{.NAMES}}"

  experiments:pilot:
    desc: >-
      Every experiment at a small size (pilot.yaml and its next-day,
      long-history, and risk-averse twins), resuming every results file, to
      measure cost per arm and noise, and to recheck on a new checkpoint
      whether its next day changes with the horizons queried and its
      dependence with the history sent
    cmds:
      - task: experiments:suite
        vars: {SET: pilot}
      - task: experiments:pilot-twins
      - echo "experiments:pilot succeeded"

  experiments:pilot-fresh:
    desc: >-
      Delete every output of experiments:pilot, then run it from scratch
    cmds:
      - task: experiments:clean-configs
        vars: {NAMES: pilot pilot_next_day pilot_long_history pilot_risk_averse}
      - task: experiments:pilot
      - echo "experiments:pilot-fresh succeeded"

  experiments:readout:
    desc: >-
      Real-panel readout of the checkpoint the JointFM service serves
      (readout.yaml): its scenario comparison and report, resuming its results
      file
    cmds:
      - task: experiments:run
        vars: {CONFIG: '{{.CONFIG_DIR}}/readout.yaml'}
      - task: experiments:report
        vars: {CONFIG: '{{.CONFIG_DIR}}/readout.yaml'}
      - echo "experiments:readout succeeded"

  experiments:readout-fresh:
    desc: >-
      Delete every output of experiments:readout, then read the checkpoint
      the JointFM service now serves from scratch
    cmds:
      - task: experiments:clean-configs
        vars: {NAMES: readout}
      - task: experiments:readout
      - echo "experiments:readout-fresh succeeded"

  experiments:full:
    desc: >-
      Every experiment at full size (full.yaml and its risk-averse twin),
      resuming every results file
    cmds:
      - task: experiments:suite
        vars: {SET: full}
      - echo "experiments:full succeeded"

  experiments:full-fresh:
    desc: >-
      Delete every output of experiments:full, then run it from scratch
    cmds:
      - task: experiments:clean-configs
        vars: {NAMES: full full_risk_averse}
      - task: experiments:full
      - echo "experiments:full-fresh succeeded"

  data:risk-free-rates:
    desc: >-
      Download the daily 3-month Treasury bill rate (FRED DTB3) to
      data/rates/dtb3.csv, the risk-free rates the rebalancing configs read
    cmds:
      - >-
        uv run python -c "from portfolio_optimization.risk_free import
        download_risk_free_rates; download_risk_free_rates('data/rates/dtb3.csv')"
      - echo "data:risk-free-rates succeeded for data/rates/dtb3.csv"

  experiments:test:
    desc: CPU tests of the experiments (no GPU or JointFM service needed)
    cmds:
      - >-
        uv run --group dev --extra experiments pytest
        tests/test_simulator_comparison.py tests/test_simulator_config.py
        tests/test_simulator_scores.py tests/test_simulator_report.py
        tests/test_simulator_rebalancing.py tests/test_simulator_clean.py
        tests/test_simulator_portfolios.py tests/test_simulator_horizons.py
        tests/test_simulator_swaps.py tests/test_simulator_chosen.py
        tests/test_simulator_attribution.py tests/test_simulator_paired.py
        tests/test_simulator_blog.py tests/test_simulator_devices.py -q
      - echo "experiments:test succeeded"
